[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "x402-anthropic"
dynamic = ["version"]
description = "x402 payment transport for the Anthropic Python SDK"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["anthropic", "x402", "payments", "http402", "claude"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "anthropic>=0.49.0",
    "httpx>=0.27.0",
    "x402>=0.7.0",
]

[project.optional-dependencies]
evm = ["x402[evm]"]
svm = ["x402[svm]"]
all = ["x402[evm]", "x402[svm]"]
dev = ["pytest>=8.0", "respx>=0.21"]

[project.urls]
Homepage = "https://github.com/kinance/x402-anthropic-python"
Repository = "https://github.com/kinance/x402-anthropic-python"

[tool.hatch.version]
path = "x402_anthropic/__init__.py"
